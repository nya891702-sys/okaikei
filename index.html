<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文化祭 POS</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header><h1>文化祭 POS</h1><p>PC：注文作成　｜　iPhone：会計</p></header><div class="tabs"><button class="active" onclick="show('pc',this)">PC注文</button><button onclick="show('iphone',this)">iPhone会計</button></div><section id="pc" class="page active"><h2>注文受付</h2><div id="items" class="items"></div><div class="summary"><span>合計 <b id="sum">¥0</b></span><button onclick="makeBarcode()">バーコードを作成</button></div><div class="panel"><h3>価格・最大個数</h3><div id="settings"></div><button onclick="saveSettings()">設定を保存</button></div><div class="panel"><h3>在庫</h3><div id="stocks"></div></div><div class="panel"><h3>注文履歴</h3><div id="history"></div><button onclick="clearHistory()">履歴を消去</button></div></section><section id="iphone" class="page"><h2>iPhone会計</h2><p>PCで作ったバーコードを読み取ります。</p><div class="scanner"><video id="video" playsinline></video><div class="cross"></div></div><button onclick="startScan()">カメラを起動</button> <button onclick="stopScan()">停止</button><p id="status">待機中</p><div class="manual"><input id="manualCode" placeholder="コードを手入力"><button onclick="readCode(manualCode.value)">読み取る</button></div><div id="receipt"></div></section></div><div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="modal.classList.add('hidden')">×</button><h2>会計用バーコード</h2><p id="barcodeInfo"></p><div id="barcodeBox"></div><code id="barcodeText"></code><button onclick="window.print()">印刷</button></div></div><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="app.js"></script></body></html>
