<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭 POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>文化祭 POS</h1>
  <nav>
    <button class="tab active" data-page="pc">PC・注文受付</button>
    <button class="tab" data-page="iphone">iPhone・会計</button>
  </nav>
</header>

<main>
<section id="pc" class="page active">
  <div class="top">
    <div><h2>注文受付</h2><p>注文を確定すると在庫が減り、会計用バーコードを作成します。</p></div>
    <button id="settingsBtn">商品設定</button>
  </div>
  <div id="products" class="grid"></div>
  <div class="order-box">
    <h3>今回の注文</h3>
    <div id="cart"></div>
    <div class="total"><span>合計</span><b id="total">¥0</b></div>
    <button id="confirm" class="main-btn">注文確定 → バーコード発行</button>
  </div>

  <div class="stock-box">
    <h3>現在の在庫</h3>
    <div id="stock"></div>
  </div>

  <div class="history-box">
    <div class="top"><h3>注文履歴</h3><button id="clearHistory">履歴を消去</button></div>
    <div id="history"></div>
  </div>
</section>

<section id="iphone" class="page">
  <h2>iPhone・会計</h2>
  <p>PCで発行したバーコードをカメラにかざしてください。</p>
  <div class="scanner"><video id="video" playsinline></video><div class="scan-frame"></div></div>
  <div class="buttons"><button id="start" class="main-btn">カメラを起動</button><button id="stop">停止</button></div>
  <p id="status">待機中</p>
  <div class="manual"><input id="codeInput" placeholder="コードを手入力"><button id="manual">読み取る</button></div>
  <div id="payment"></div>
</section>
</main>

<div id="settingsModal" class="modal hidden">
 <div class="modal-card">
  <button id="closeSettings" class="x">×</button>
  <h2>商品設定</h2>
  <p>価格と最大在庫を変更できます。</p>
  <div id="settings"></div>
  <button id="save" class="main-btn">保存</button>
 </div>
</div>

<div id="barcodeModal" class="modal hidden">
 <div class="modal-card center">
  <button id="closeBarcode" class="x">×</button>
  <h2>会計用バーコード</h2>
  <p id="orderNo"></p>
  <svg id="barcode"></svg>
  <code id="rawCode"></code>
  <p>このバーコードをiPhoneで読み取ります。</p>
  <button id="print" class="main-btn">印刷</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
