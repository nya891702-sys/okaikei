<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭 POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div><h1>文化祭 POS</h1><p>PC：注文・在庫管理　／　iPhone：会計</p></div>
  <nav>
    <button class="nav active" data-page="order">注文</button>
    <button class="nav" data-page="stock">在庫</button>
    <button class="nav" data-page="history">履歴</button>
    <button class="nav" data-page="settings">設定</button>
    <button class="nav" data-page="pay">iPhone会計</button>
  </nav>
</header>

<section id="order" class="page active">
  <div class="page-title"><div><h2>注文受付</h2><p>＋／−で数量を調整</p></div><button id="clearOrder">注文をクリア</button></div>
  <div id="products" class="product-grid"></div>
  <aside class="cart">
    <h3>今回の注文</h3><div id="cartItems"></div>
    <div class="total"><span>合計</span><strong id="cartTotal">¥0</strong></div>
    <button id="confirmOrder" class="primary big">注文確定・会計バーコード発行</button>
  </aside>
</section>

<section id="stock" class="page">
  <div class="page-title"><div><h2>在庫</h2><p>注文確定時に自動で減ります。</p></div></div>
  <div id="stockGrid" class="stock-grid"></div>
</section>

<section id="history" class="page">
  <div class="page-title"><div><h2>注文履歴</h2><p>会計状況も確認できます。</p></div><button id="clearHistory">履歴を全削除</button></div>
  <div id="historyList"></div>
</section>

<section id="settings" class="page">
  <h2>商品・店舗設定</h2>
  <div class="settings-box">
    <label>店名 <input id="shopName" type="text"></label>
    <label>消費税率（%） <input id="taxRate" type="number" min="0" max="100"></label>
  </div>
  <div id="settingsGrid" class="settings-grid"></div>
  <div class="actions"><button id="saveSettings" class="primary">設定を保存</button><button id="resetAll">全データを初期化</button></div>
  <p id="settingMessage" class="message"></p>
</section>

<section id="pay" class="page">
  <h2>iPhone会計モード</h2>
  <p>iPhoneのSafariで開き、カメラで会計バーコードを読み取ります。</p>
  <div class="scanner"><video id="video" playsinline></video><div class="frame"></div></div>
  <div class="actions"><button id="startCamera" class="primary">カメラを起動</button><button id="stopCamera">停止</button></div>
  <p id="scanStatus" class="message">待機中</p>
  <div class="manual"><input id="manualCode" placeholder="バーコード文字列を手入力"><button id="manualRead">読み取る</button></div>
  <div id="paymentResult"></div>
</section>
</div>

<div id="barcodeModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeModal">×</button>
    <h2>会計用バーコード</h2>
    <p id="orderNumberText"></p>
    <svg id="barcode"></svg><code id="barcodeValue"></code>
    <p class="hint">このバーコードをiPhoneで読み取ります。</p>
    <button id="printBarcode" class="primary">印刷</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
