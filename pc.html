<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭POS | 注文受付</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>文化祭POS</h1><p>注文受付・在庫管理</p></div><a href="iphone.html" target="_blank">iPhone会計画面 ↗</a></header>
<main class="pc-layout">
<section>
<h2>注文受付</h2><div id="products" class="products"></div>
<div class="orderbar"><span>合計 <strong id="total">¥0</strong></span><button id="create" class="primary">注文確定・バーコード作成</button></div>
</section>
<aside>
<div class="panel"><h2>在庫</h2><div id="stock"></div></div>
<div class="panel"><h2>価格・最大個数</h2><div id="settings"></div><button id="save">設定を保存</button></div>
<div class="panel"><h2>注文履歴</h2><div id="history"></div><button id="clear">履歴を消去</button></div>
</aside>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="close" class="close">×</button><h2 id="barcodeTitle"></h2><canvas id="barcodeCanvas"></canvas><p class="code" id="codeText"></p><button id="download">バーコード画像を保存</button><button onclick="print()">印刷</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="pc.js"></script>
</body></html>
