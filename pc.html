<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭POS - PC注文</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>文化祭POS</h1><span>PC・注文受付</span></div><a href="iphone.html" target="_blank">iPhone会計 →</a></header>
<main class="pc-grid">
<section>
<h2>注文</h2><div id="products" class="products"></div>
<div class="orderbar"><div>合計 <strong id="total">¥0</strong></div><button id="orderBtn" class="primary">注文確定 → QRコード</button></div>
</section>
<aside>
<div class="panel"><h2>在庫</h2><div id="stock"></div></div>
<div class="panel"><h2>価格・最大在庫</h2><div id="settings"></div><button id="saveBtn">設定を保存</button></div>
<div class="panel"><h2>履歴</h2><div id="history"></div><button id="clearBtn">履歴を消去</button></div>
</aside>
</main>

<div id="qrModal" class="modal" hidden>
<div class="modal-card">
<button type="button" id="closeBtn" class="close">×</button>
<h2 id="qrTitle">QRコード</h2>
<div id="qrcode"></div>
<p id="qrData"></p>
<button type="button" id="printBtn">印刷</button>
<button type="button" id="newBtn" class="primary">閉じる</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="pc.js"></script>
</body></html>
