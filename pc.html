<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文化祭POS PC</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>文化祭POS</h1><small>PC・注文受付</small></div><a href="iphone.html" target="_blank">iPhone会計 ↗</a></header>
<main class="pc"><section><h2>注文</h2><div id="products" class="products"></div><div class="orderbar"><b>合計 <span id="total">¥0</span></b><button id="make" class="primary">注文確定・バーコード作成</button></div></section>
<aside><div class="panel"><h2>在庫</h2><div id="stock"></div></div><div class="panel"><h2>価格・最大個数</h2><div id="settings"></div><button id="save">設定を保存</button></div><div class="panel"><h2>注文履歴</h2><div id="history"></div><button id="clear">履歴を消去</button></div></aside></main>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="close" class="close">×</button><h2 id="title"></h2><canvas id="barcode"></canvas><p id="raw"></p><button id="png">PNG保存</button><button onclick="window.print()">印刷</button></div></div><script src="pc.js"></script></body></html>
