<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭POS - iPhone会計</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>文化祭POS</h1><span>iPhone・会計</span></div><a href="pc.html">PC注文 →</a></header>
<main class="iphone-main">
<h2>QRコード読み取り</h2>
<div class="camera-box"><video id="video" autoplay muted playsinline></video><div class="scan-frame"></div></div>
<div class="actions"><button id="startBtn" class="primary">カメラを起動</button><button id="stopBtn">停止</button></div>
<p id="status">カメラを起動してください。</p>
<div class="manual"><input id="manualCode" placeholder="QRデータを手入力"><button id="manualBtn">表示</button></div>
<div id="receipt"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="iphone.js"></script>
</body></html>
